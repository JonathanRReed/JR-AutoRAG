version: '3.9'
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      JR_DATA_DIR: /data
      AUTORAG_EXPOSE: "true"
      AUTORAG_AUTH_ENABLED: "true"
      AUTORAG_API_KEYS: ${AUTORAG_API_KEYS:?Set AUTORAG_API_KEYS before starting the exposed API}
    volumes:
      - api-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      BUN_PUBLIC_API_BASE_URL: http://api:8000
      BUN_PUBLIC_BROWSER_API_BASE_URL: http://127.0.0.1:8000

volumes:
  api-data:
