[project]
name = "jr-autorag-api"
version = "0.1.0"
description = "Local-first FastAPI backend for JR AutoRAG."
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.48.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "scikit-learn==1.8.0",
  "python-multipart==0.0.29",
  "pypdf==6.12.1",
  "python-docx==1.2.0",
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
  "chromadb>=0.4.0",
  "rank-bm25>=0.2.2",
  "langextract[openai]>=1.1.1",
]

[project.optional-dependencies]
ml = [
  "docling>=2.48.0",
  "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.15.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
