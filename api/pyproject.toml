[project]
name = "jr-autorag-api"
version = "0.1.0"
description = "Local-first FastAPI backend for JR AutoRAG."
requires-python = ">=3.11,<3.15"
authors = [
  { name = "Jonathan R. Reed" },
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "scikit-learn==1.9.0",
  "python-multipart==0.0.32",
  "pypdf==6.16.2",
  "python-docx==1.2.0",
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
  "chromadb>=0.4.0",
  "rank-bm25>=0.2.2",
  "langextract[openai]>=1.1.1",
]

[project.urls]
Homepage = "https://jonathanrreed.com/projects/jr-autorag/"
Source = "https://github.com/JonathanRReed/JR-AutoRAG"
Issues = "https://github.com/JonathanRReed/JR-AutoRAG/issues"

[project.optional-dependencies]
ml = [
  "docling>=2.48.0",
  "sentence-transformers>=2.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
