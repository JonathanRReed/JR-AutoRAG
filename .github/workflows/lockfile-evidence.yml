name: Temporary Lockfile Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/lockfile-evidence.yml"
      - "package.json"
      - "api/pyproject.toml"

permissions:
  contents: read

jobs:
  bun-lock:
    if: github.event.pull_request.number == 136
    name: Generate Bun lockfile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.1"
      - name: Regenerate with the actual Bun package manager
        run: bun install --lockfile-only --ignore-scripts
      - name: Emit exact generated lockfile bytes
        run: |
          printf 'LOCKFILE_BEGIN:bun.lock\n'
          base64 bun.lock
          printf 'LOCKFILE_END:bun.lock\n'

  uv-lock:
    if: github.event.pull_request.number == 139
    name: Generate uv lockfile evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Regenerate with the actual uv package manager
        working-directory: api
        run: uv lock
      - name: Emit exact generated lockfile bytes
        run: |
          printf 'LOCKFILE_BEGIN:api/uv.lock\n'
          base64 api/uv.lock
          printf 'LOCKFILE_END:api/uv.lock\n'
