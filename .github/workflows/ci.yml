name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BUN_VERSION: "1.3.9"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Python API: lint, test
  # ─────────────────────────────────────────────────────────────
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install --system -r requirements.txt

      - name: Lint with Ruff (critical rules)
        run: ruff check . --select F821,F811,E9 --output-format=github

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --ignore=tests/__pycache__ -x --timeout=60

      - name: Check imports work
        run: |
          python -c "from app.main import app; print('API imports OK')"

  # ─────────────────────────────────────────────────────────────
  # Web frontend: type-check, build
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web (Bun/React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run frontend tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  ci-ok:
    name: CI Passed (gated)
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        run: echo "All required CI jobs passed."
