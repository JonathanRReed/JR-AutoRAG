name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "artifacts/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BUN_VERSION: "1.3.13"

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check . --select F821,F811,E9 --output-format=github
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run pytest tests/ -v --tb=short --ignore=tests/__pycache__ -x --timeout=60 -k 'not document_ingest_query_and_evaluation'
          else
            uv run pytest tests/ -v --tb=short --ignore=tests/__pycache__ -x --timeout=60
          fi
      - run: uv run python -c "from app.main import app; print('API imports OK')"

  web:
    name: Web (Bun/React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  install-smoke:
    name: Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bash scripts/install-smoke.sh

  container-manifest:
    name: Container Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-manifest-check.sh

  research-architecture:
    name: Research Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/research-architecture-check.sh

  release-evidence:
    name: Release Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bash scripts/container-build-smoke.sh
      - run: bash scripts/secret-scan.sh
      - run: bash scripts/supply-chain-evidence.sh

  evidence-handoff:
    name: Evidence and Handoff Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/evidence-bundle.test.sh
      - run: bash scripts/client-handoff-gate.test.sh

  ci-ok:
    name: CI Passed (PR gated)
    if: always()
    needs: [api, web, install-smoke, container-manifest, research-architecture, release-evidence, evidence-handoff]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ "$result" = success ] || exit 1
          done
          echo "Required PR CI jobs passed."
