name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BUN_VERSION: "1.3.13"

jobs:
  # ─────────────────────────────────────────────────────────────
  # Python API: lint, test
  # ─────────────────────────────────────────────────────────────
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint with Ruff (critical rules)
        run: uv run ruff check . --select F821,F811,E9 --output-format=github

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --ignore=tests/__pycache__ -x --timeout=60

      - name: Check imports work
        run: uv run python -c "from app.main import app; print('API imports OK')"

  # ─────────────────────────────────────────────────────────────
  # Web frontend: type-check, build
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web (Bun/React)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run frontend tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Local install smoke: uv API imports, Bun shell, API proxy
  # ─────────────────────────────────────────────────────────────
  install-smoke:
    name: Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Run local install smoke
        run: bash scripts/install-smoke.sh

  # ─────────────────────────────────────────────────────────────
  # Container manifests: Dockerfile and docker-compose invariants
  # ─────────────────────────────────────────────────────────────
  container-manifest:
    name: Container Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate container manifests
        run: bash scripts/container-manifest-check.sh

  # ─────────────────────────────────────────────────────────────
  # Research architecture: current primary-source matrix and path evidence
  # ─────────────────────────────────────────────────────────────
  research-architecture:
    name: Research Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate research architecture evidence
        run: bash scripts/research-architecture-check.sh

  # ─────────────────────────────────────────────────────────────
  # Container smoke: build API and web images, then verify runtime endpoints
  # ─────────────────────────────────────────────────────────────
  container-smoke:
    name: Container Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke test containers
        run: bash scripts/container-build-smoke.sh

  # ─────────────────────────────────────────────────────────────
  # Secret scan: high-confidence provider keys and tracked data
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret scan
        run: bash scripts/secret-scan.sh

  # ─────────────────────────────────────────────────────────────
  # Supply chain: Python SBOM and frontend audit receipts
  # ─────────────────────────────────────────────────────────────
  supply-chain:
    name: Supply Chain Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Set up Bun ${{ env.BUN_VERSION }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Generate supply-chain evidence
        run: bash scripts/supply-chain-evidence.sh

  # ─────────────────────────────────────────────────────────────
  # Evidence and handoff gates: bundle integrity and strict client acceptance
  # ─────────────────────────────────────────────────────────────
  evidence-handoff:
    name: Evidence and Handoff Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run evidence bundle regression
        run: bash scripts/evidence-bundle.test.sh

      - name: Run strict handoff gate regression
        run: bash scripts/client-handoff-gate.test.sh

  ci-ok:
    name: CI Passed (gated)
    needs: [api, web, install-smoke, container-manifest, research-architecture, container-smoke, secret-scan, supply-chain, evidence-handoff]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        run: echo "All required CI jobs passed."
